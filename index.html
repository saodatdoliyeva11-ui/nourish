@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const Q={},L={};
function pick(c){const a=M[c];if(!Q[c]||!Q[c].length){Q[c]=a.map((_,i)=>i).sort(()=>Math.random()-.5);if(Q[c][0]===L[c]&&a.length>1)Q[c].reverse()}return a[L[c]=Q[c].pop()]}
function say(c){const p=$("#say");p.style.opacity=0;setTimeout(()=>{p.textContent=pick(c);p.style.opacity=1},200);cur=c}
let cur="menu";

<div class="row"><button class="btn" data-a="lazy">I don’t feel like cooking</button></div>`}
function shopData(){const m={};DAYS.forEach((d,di)=>d[2].forEach(me=>me[2].split(";").forEach(x=>{const[,n,c]=x.split("~");(m[n]=m[n]||{c,d:new Set()}).d.add(d[0])})));return m}
function shop(){const m=shopData(),names=Object.keys(m),n=names.filter(k=>S.shop[k]).length;
return`<h2>Shopping list</h2><div class="bar"><i style="width:${n/names.length*100}%"></i></div><div class="sub">${n} of ${names.length} in the basket</div>`+Object.keys(CAT).map(c=>{const l=names.filter(k=>m[k].c==c).sort();return`<div class="sec">${CAT[c]}</div>`+l.map(k=>`<label class="it"><input type="checkbox" data-a="shop" data-v="${esc(k)}" ${S.shop[k]?"checked":""}><span class="bx">✓</span><span class="nm">${k}</span><span class="tag">${[...m[k].d].join(" ")}</span></label>`).join("")}).join("")+`<div class="row"><button class="btn" data-a="reset">Start a new list</button></div>`}
function gal(){const e=S.photos.find(p=>p.id==editId)||{};return`<h2>My kitchen</h2><form id="f"><b>${editId?"Edit this memory":"Add a meal you made"}</b>
<input type="file" accept="image/*" id="img" ${editId?"":"required"}><input id="nm" placeholder="Meal name" required value="${esc(e.name)}">
<input type="date" id="dt" value="${e.date||today()}"><select id="ct">${["breakfast","lunch","dinner","snack","drink"].map(c=>`<option ${e.cat==c?"selected":""}>${c}</option>`).join("")}</select>
<textarea id="nt" rows="2" placeholder="A personal note (how did it taste? what would you change?)">${esc(e.note)}</textarea><input id="lk" type="url" placeholder="Recipe or video link (optional)" value="${esc(e.link)}">
<div class="row"><button class="btn pri" type="submit">${editId?"Save changes":"Save to my kitchen"}</button>${editId?`<button class="btn" type="button" data-a="cancel">Cancel</button>`:""}</div></form>
<div class="grid">${S.photos.length?[...S.photos].sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>`<div class="ph" style="--r:${i%2?1.5:-1.5}deg"><img src="${p.img}" alt="${esc(p.name)}"><div><b>${esc(p.name)}</b> <span class="pill">${p.cat}</span><br><small>${p.date}</small>${p.note?`<br>${esc(p.note)}`:""}${p.link&&/^https?:/.test(p.link)?`<br><a target="_blank" rel="noopener" href="${esc(p.link)}">Recipe / video</a>`:""}<div class="row"><button class="chip" data-a="edit" data-v="${p.id}">Edit</button><button class="chip" data-a="del" data-v="${p.id}">Delete</button></div></div></div>`).join(""):`<p>Nothing here yet. The first photo is always the hardest and the cutest.</p>`}</div>`}
function learn(){return`<h2>Ingredients, explained kindly</h2>`+KN.map(k=>`<details class="kn"><summary>${k[0]}</summary><p>${k[1]}</p><p><b>Cook with it:</b> ${k[2]}<br><b>Loves:</b> ${k[3]}</p></details>`).join("")+`<p class="sub">General food information, not medical advice.</p>`}
function rec(){const w=wk(),cw=S.done.filter(e=>e.date>=w),ids=[...new Set(cw.map(e=>e.id))],fresh=ids.filter(id=>!S.done.some(e=>e.id==id&&e.date<w)),ph=S.photos.filter(p=>p.date>=w),fv=Object.keys(S.fav).filter(k=>S.fav[k]);
const ms=[[S.done.length>=1,"🍳 First meal cooked"],[cw.length>=5,"🌟 Five meals in one week"],[ids.length>=3&&fresh.length>=3,"🧭 Tried three new recipes"],[S.photos.length>=1,"📸 Started the archive"],[S.photos.length>=5,"📚 Five dishes in the cookbook"],[cw.some(e=>e.id.endsWith("-0")),"🌅 Had a proper breakfast"]].filter(x=>x[0]);
return`<h2>This week’s memories</h2><div class="stats"><div class="stat"><b>${cw.length}</b>meals cooked</div><div class="stat"><b>${fresh.length}</b>new recipes</div><div class="stat"><b>${ph.length}</b>photos</div><div class="stat"><b>${fv.length}</b>favourites</div></div>
<div class="sec">On the table</div><p>${ids.length?ids.map(id=>mealOf(id)[0]).join(" · "):"Nothing logged yet. The week is a blank plate, in the nicest way."}</p>
<div class="sec">Favourites</div><p>${fv.length?fv.map(id=>"💗 "+mealOf(id)[0]).join("<br>"):"Tap the heart on a recipe you love."}</p>
<div class="sec">Little achievements</div><p>${ms.length?ms.map(x=>x[1]).join("<br>"):"They’ll appear as you cook. No rush."}</p>
<div class="sec">Photo wall</div><div class="grid">${ph.map(p=>`<div class="ph"><img src="${p.img}" alt="${esc(p.name)}"></div>`).join("")}</div>`}
function render(){nav();$("#v").innerHTML={menu,shop,gal,learn,rec}[tab]()}
function go(t){tab=t;render();say(t==="menu"?(new Date().getDay()==1?"newwk":"menu"):t)}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};i.src=r.result};r.readAsDataURL(f)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a=="tab")go(v);
else if(a=="day"){day=+v;render()}
else if(a=="fav"){S.fav[v]=!S.fav[v];save();render();if(S.fav[v]){say("fav");fly(e,["💗"])}}
else if(a=="done"){const had=doneToday(v);S.done=S.done.filter(x=>!(x.id==v&&x.date==today()));if(!had){S.done.push({id:v,date:today()});fly(e,["🎀","✨","🍓"]);say(v.endsWith("-0")&&Math.random()<.6?"bf":"done")}save();render()}
else if(a=="lazy"){const l=DAYS[day][2].map((m,i)=>[m[1],i]).sort((x,y)=>x[0]-y[0])[0][1];say("lazy");toast("Easiest today: "+DAYS[day][2][l][0])}
else if(a=="reset"){S.shop={};save();render()}
else if(a=="edit"){editId=v;render();scrollTo(0,0)}
else if(a=="cancel"){editId=null;render()}
else if(a=="del"){if(confirm("Delete this memory?")){S.photos=S.photos.filter(p=>p.id!=v);save();render()}}
else if(a=="shop"){}});
document.addEventListener("change",e=>{const i=e.target;if(i.dataset.a!="shop")return;S.shop[i.dataset.v]=i.checked;save();const t=Object.keys(shopData()),n=t.filter(k=>S.shop[k]).length;$(".bar i").style.width=n/t.length*100+"%";$(".bar+.sub").textContent=n+" of "+t.length+" in the basket";
if(n==t.length){say("shopDone");fly(null,["🛒","✨","🎀"])}else if(i.checked&&Math.random()<.3)say("tick")});
document.addEventListener("submit",e=>{e.preventDefault();const f=$("#img").files[0],g=x=>$("#"+x).value;
const fin=img=>{const old=S.photos.find(p=>p.id==editId),o={id:editId||Date.now(),name:g("nm"),date:g("dt"),cat:g("ct"),note:g("nt"),link:g("lk"),img:img||old.img};
if(editId)S.photos=S.photos.map(p=>p.id==editId?o:p);else S.photos.push(o);
if(!save()){if(!editId)S.photos.pop();return}editId=null;render();say("up");fly(null,["📸","💗","✨","🍓"])};
f?shrink(f,fin):fin()});
